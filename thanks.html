<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Thank you</title>
<style>
  :root{--canvas:#eef1f4;--surface:#ffffff;--ink:#16202e;--muted:#54626f;--teal:#0b6e7a;--teal-dark:#095560;--line:#e0e5ea;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--shadow:0 1px 2px rgba(16,32,46,.05),0 12px 30px rgba(16,32,46,.08)}
  @media (prefers-color-scheme:dark){:root{--canvas:#0e1620;--surface:#152030;--ink:#e8eef4;--muted:#9fb0bf;--teal:#4fc7d4;--teal-dark:#7ed8e2;--line:#233242;--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.45)}}
  :root[data-theme="dark"]{--canvas:#0e1620;--surface:#152030;--ink:#e8eef4;--muted:#9fb0bf;--teal:#4fc7d4;--teal-dark:#7ed8e2;--line:#233242}
  :root[data-theme="light"]{--canvas:#eef1f4;--surface:#ffffff;--ink:#16202e;--muted:#54626f;--teal:#0b6e7a;--teal-dark:#095560;--line:#e0e5ea}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:40px 36px;max-width:520px;margin:22px;text-align:center}
  h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
  p{color:var(--muted);margin:0 0 22px}
  a.btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px}
  a.btn:hover{background:var(--teal-dark)}
</style>
</head>
<body>
  <div class="card">
    <h1>Thank you</h1>
    <p>Your feedback is in, and it goes straight to the team shaping this. It genuinely changes what everyone sees next.</p>
    <a class="btn" href="index.html">Back to the views</a>
  </div>
</body>
</html>
